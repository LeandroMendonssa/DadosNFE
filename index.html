<!DOCTYPE html>
<html lang="pt-BR" data-font="sans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Minhas Notas</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Minhas Notas">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@400;700&family=Source+Code+Pro:wght@400;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading" data-theme="light" data-icon-theme="solid">
   
    <div id="login-screen" style="display: flex;">
        <div class="login-box">
            <div class="icon"><i class="fas fa-lock" id="login-icon"></i></div>
            <h1>Acesso Restrito</h1>
            <p>Faça login para continuar.</p>
            <input type="email" id="email-input" placeholder="Seu e-mail" style="margin-bottom: 16px;">
            <input type="password" id="password-input" placeholder="Sua senha">
            <div id="error-message" class="error-message"></div>
            <button id="login-button" class="actions-button" onclick="handleLogin()">Entrar</button>
        </div>
    </div>
    
    <div class="app-container" id="app-container" style="display: none;">
        <nav class="sidebar">
            <div class="sidebar-header">Minhas Notas</div>
            <ul id="sidebar-nav" class="sidebar-nav"></ul>
        </nav>
        
        <div class="main-content">
            <header class="header">
                <h1 id="main-header-title" class="header-title">Adicionar</h1>
                <div class="header-actions">
                    <button class="header-action" id="sync-btn" onclick="sincronizarManualmente(this)">
                        <span class="icon-wrapper"><i class="fa-solid fa-sync-alt"></i><span class="material-icons">sync</span></span>
                    </button>
                    <button class="header-action" id="close-btn" style="display: none;">
                        <span class="icon-wrapper"><i class="fa-solid fa-times"></i><span class="material-icons">close</span></span>
                    </button>
                </div>
            </header>
            
            <div class="screen-wrapper">
                </div>
        </div>
        
        <nav id="tab-bar" class="tab-bar"></nav>
    </div>

    <div id="confirm-modal" class="modal-screen">
        <div class="modal-content">
            <h2 id="confirm-title"></h2>
            <p id="confirm-message"></p>
            <div class="confirm-actions">
                <button id="cancel-btn" class="actions-button" style="background-color: var(--text-light);">Cancelar</button>
                <button id="confirm-btn" class="actions-button">Confirmar</button>
            </div>
        </div>
    </div>

    <div id="modalPreview" class="modal-preview">
        <button class="modal-preview-fechar" onclick="fecharPreview()">×</button>
        <img class="modal-preview-conteudo" id="imgPreview">
        <div class="modal-preview-nav">
            <button id="prevBtn" onclick="navegarFotos(-1)"><i class="fa-solid fa-chevron-left"></i></button>
            <button id="nextBtn" onclick="navegarFotos(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="modal-preview-bottom">
            <button class="modal-preview-action" onclick="salvarFotoPreview()"><i class="fa-solid fa-download"></i> Salvar</button>
            <button class="modal-preview-action delete" onclick="excluirFotoPreview()"><i class="fa-solid fa-trash-alt"></i> Excluir</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="script.js" defer></script>
</body>
</html>
